<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Brick Breaker</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="game-root">
      <!-- HUD -->
      <header id="hud">
        <div class="hud-item">
          Time:
          <span id="hud-time">0.0</span>
          s
        </div>
        <div class="hud-item">
          Score:
          <span id="hud-score">0</span>
        </div>
        <div class="hud-item">
          Level:
          <span id="hud-level">1</span>
        </div>
        <div class="hud-item">
          Lives:
          <span id="hud-lives">3</span>
        </div>
        <div class="hud-item">
          FPS:
          <span id="hud-fps">0</span>
        </div>
      </header>

      <!-- Game Area -->
      <main id="game-area">
        <div id="paddle"></div>
        <div id="ball"></div>
      </main>

      <!-- Pause Menu -->
      <div id="pause-overlay" class="hidden">
        <div id="pause-menu">
          <h2>Paused</h2>
          <button id="btn-continue">Resume</button>
          <button id="btn-restart">Restart</button>
        </div>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameover-overlay" class="hidden">
        <div id="gameover-menu">
          <h2>Game Over</h2>

          <p>
            Final Score:
            <span id="gameover-score">0</span>
          </p>

          <!-- Nickname input -->
          <div id="nickname-box">
            <label for="nickname-input">Your name:</label>
            <input id="nickname-input" type="text" maxlength="10" size="10" autocomplete="off" placeholder="10 char max" />
            <button id="btn-save-score">Save Score</button>
          </div>
          <p id="highscore-status" class="highscore-status hidden"></p>

          <!-- Highscore table -->
          <div id="highscore-table" class="hidden">
            <h3>Leaderboard</h3>
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nickname</th>
                  <th>Score</th>
                </tr>
              </thead>
              <tbody id="highscore-body"></tbody>
            </table>
          </div>

          <button id="btn-restart-from-gameover">Restart</button>
        </div>
      </div>
    </div>

    <!-- Main game script -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
