services:
  postgres:
    image: postgres:16-alpine
    container_name: make-your-game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: make_your_game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d make_your_game']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
